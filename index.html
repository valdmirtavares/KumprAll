<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrocaJá — Classificados em Portugal</title>
  <style>
    :root {
      --green: #087f5b;
      --green-dark: #066548;
      --ink: #202a27;
      --muted: #66736e;
      --line: #e5ebe8;
      --bg: #f5f7f6;
      --white: #fff;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }
    .nav {
      max-width: 1160px;
      margin: auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .logo {
      color: var(--green);
      font-weight: 900;
      font-size: 25px;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }
    .search {
      flex: 1;
      display: flex;
      gap: 8px;
    }
    .search input {
      width: 100%;
      min-width: 100px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline-color: var(--green);
      background: #fafcfb;
    }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 750;
    }
    .btn-primary { background: var(--green); color: white; }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-light { background: #edf5f1; color: var(--green-dark); }
    .nav-actions { display: flex; gap: 9px; align-items: center; }

    main { max-width: 1160px; margin: 28px auto 60px; padding: 0 20px; }
    .hero {
      padding: 32px;
      border-radius: 22px;
      background: linear-gradient(115deg, #dff4e9, #f1f8f4 65%, #e8f3ee);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }
    .hero h1 { font-size: clamp(28px, 4vw, 42px); line-height: 1.1; margin: 0 0 9px; }
    .hero p { color: var(--muted); margin: 0; }
    .hero-emoji { font-size: 64px; }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 2px 0 17px;
    }
    .category {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 15px;
    }
    .category.active { background: var(--green); color: white; border-color: var(--green); }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 10px 0 16px;
    }
    .section-title h2 { margin: 0; font-size: 22px; }
    .sort {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 17px;
    }
    .card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      background: white;
      border: 1px solid var(--line);
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px #18352a12; }
    .photo {
      height: 185px;
      background: #eaf1ed;
      display: grid;
      place-items: center;
      font-size: 66px;
      overflow: hidden;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .heart {
      position: absolute;
      right: 11px;
      top: 11px;
      width: 37px;
      height: 37px;
      border: 0;
      border-radius: 50%;
      background: white;
      font-size: 19px;
      box-shadow: 0 2px 10px #0002;
    }
    .heart.saved { color: #d83d58; }
    .card-body { padding: 13px 14px 15px; }
    .price { font-size: 19px; font-weight: 850; }
    .card h3 { font-size: 15px; line-height: 1.35; margin: 5px 0 11px; min-height: 40px; }
    .meta { color: var(--muted); font-size: 13px; }
    .empty {
      grid-column: 1 / -1;
      padding: 40px 15px;
      text-align: center;
      color: var(--muted);
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--line);
    }
    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      padding: 25px 15px;
      font-size: 13px;
    }

    dialog {
      width: min(560px, calc(100% - 24px));
      border: 0;
      border-radius: 18px;
      padding: 0;
      box-shadow: 0 25px 80px #0004;
    }
    dialog::backdrop { background: #14231dcc; }
    .modal-head {
      padding: 20px 23px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-head h2 { margin: 0; font-size: 21px; }
    .close {
      border: 0;
      background: transparent;
      font-size: 25px;
      color: var(--muted);
    }
    form { padding: 20px 23px 24px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid #dce5e0;
      border-radius: 9px;
      padding: 11px 12px;
      background: white;
    }
    .field textarea { min-height: 88px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .note { color: var(--muted); font-size: 12px; margin: -3px 0 14px; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .nav { gap: 14px; }
    }
    @media (max-width: 650px) {
      .nav { flex-wrap: wrap; padding: 12px 15px; }
      .search { order: 3; flex-basis: 100%; }
      .nav-actions { margin-left: auto; }
      .nav-actions .btn-light { display: none; }
      main { margin-top: 18px; padding: 0 14px; }
      .hero { padding: 24px 20px; }
      .hero-emoji { font-size: 45px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
      .photo { height: 145px; }
      .card-body { padding: 11px; }
      .section-title h2 { font-size: 19px; }
    }
    @media (max-width: 380px) {
      .grid { grid-template-columns: 1fr; }
      .photo { height: 210px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="logo" href="#" aria-label="TrocaJá início">trocaJá</a>
      <div class="search">
        <input id="searchInput" type="search" placeholder="O que procura? Ex.: bicicleta, sofá…">
        <button class="btn btn-primary" id="searchBtn">Pesquisar</button>
      </div>
      <div class="nav-actions">
        <button class="btn btn-light" id="favoritesBtn">♡ Favoritos</button>
        <button class="btn btn-primary" id="openForm">＋ Anunciar</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Encontre. Venda.<br>Volte a descobrir.</h1>
        <p>Milhares de oportunidades perto de si, em Portugal.</p>
      </div>
      <div class="hero-emoji" aria-hidden="true">🛍️</div>
    </section>

    <nav class="categories" id="categories" aria-label="Categorias"></nav>

    <div class="section-title">
      <h2 id="listingHeading">Anúncios recentes</h2>
      <select class="sort" id="sortSelect" aria-label="Ordenar anúncios">
        <option value="recent">Mais recentes</option>
        <option value="low">Preço: menor primeiro</option>
        <option value="high">Preço: maior primeiro</option>
      </select>
    </div>

    <section class="grid" id="listings" aria-live="polite"></section>
  </main>

  <footer>TrocaJá · Classificados locais em Portugal · Compre e venda com bom senso.</footer>

  <dialog id="listingDialog">
    <div class="modal-head">
      <h2>Publicar anúncio</h2>
      <button class="close" id="closeForm" aria-label="Fechar">×</button>
    </div>
    <form id="listingForm">
      <div class="field">
        <label for="title">Título do anúncio *</label>
        <input id="title" name="title" maxlength="70" required placeholder="Ex.: Bicicleta de montanha">
      </div>
      <div class="form-row">
        <div class="field">
          <label for="price">Preço (€) *</label>
          <input id="price" name="price" type="number" min="0" step="0.01" required placeholder="150">
        </div>
        <div class="field">
          <label for="category">Categoria *</label>
          <select id="category" name="category" required></select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="location">Localidade *</label>
          <input id="location" name="location" required placeholder="Ex.: Lisboa">
        </div>
        <div class="field">
          <label for="emoji">Ícone do anúncio</label>
          <select id="emoji" name="emoji">
            <option>📦</option><option>🚲</option><option>📱</option>
            <option>🛋️</option><option>👗</option><option>🚗</option>
            <option>🏠</option><option>🎮</option><option>🐾</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="description">Descrição</label>
        <textarea id="description" name="description" maxlength="500" placeholder="Descreva o estado, as características e outros detalhes…"></textarea>
      </div>
      <div class="field">
        <label for="image">Imagem (opcional)</label>
        <input id="image" name="image" type="url" placeholder="https://exemplo.pt/imagem.jpg">
      </div>
      <p class="note">Este protótipo guarda os anúncios apenas no navegador atual.</p>
      <button class="btn btn-primary" type="submit" style="width:100%">Publicar anúncio</button>
    </form>
  </dialog>

  <script>
    const categoryNames = [
      "Todas", "Veículos", "Imóveis", "Eletrónica",
      "Casa e Jardim", "Moda", "Desporto", "Lazer"
    ];

    const starterListings = [
      { id: 1, title: "Bicicleta urbana em ótimo estado", price: 185, category: "Desporto", location: "Porto", emoji: "🚲", date: Date.now() - 1000 },
      { id: 2, title: "Sofá de 3 lugares — muito confortável", price: 240, category: "Casa e Jardim", location: "Lisboa", emoji: "🛋️", date: Date.now() - 2000 },
      { id: 3, title: "Smartphone desbloqueado, 128 GB", price: 310, category: "Eletrónica", location: "Braga", emoji: "📱", date: Date.now() - 3000 },
      { id: 4, title: "Casaco de inverno, tamanho M", price: 35, category: "Moda", location: "Coimbra", emoji: "🧥", date: Date.now() - 4000 },
      { id: 5, title: "Carro citadino económico", price: 5900, category: "Veículos", location: "Aveiro", emoji: "🚗", date: Date.now() - 5000 },
      { id: 6, title: "Apartamento T1 luminoso", price: 850, category: "Imóveis", location: "Setúbal", emoji: "🏠", date: Date.now() - 6000 },
      { id: 7, title: "Consola de jogos com comando", price: 220, category: "Lazer", location: "Faro", emoji: "🎮", date: Date.now() - 7000 },
      { id: 8, title: "Mesa de jardim com quatro cadeiras", price: 95, category: "Casa e Jardim", location: "Leiria", emoji: "🌿", date: Date.now() - 8000 }
    ];

    let listings = load("trocaja-listings", starterListings);
    let favorites = load("trocaja-favorites", []);
    let activeCategory = "Todas";
    let showFavorites = false;

    function load(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return value ?? fallback;
      } catch {
        return fallback;
      }
    }

    function save() {
      localStorage.setItem("trocaja-listings", JSON.stringify(listings));
      localStorage.setItem("trocaja-favorites", JSON.stringify(favorites));
    }

    const categories = document.getElementById("categories");
    const categorySelect = document.getElementById("category");
    const listingGrid = document.getElementById("listings");

    function renderCategories() {
      categories.innerHTML = categoryNames.map(name =>
        `<button class="category ${activeCategory === name ? "active" : ""}" data-category="${name}">${name}</button>`
      ).join("");
      categorySelect.innerHTML = categoryNames.slice(1).map(name =>
        `<option value="${name}">${name}</option>`
      ).join("");
    }

    function euro(value) {
      return new Intl.NumberFormat("pt-PT", {
        style: "currency", currency: "EUR", maximumFractionDigits: 2
      }).format(Number(value));
    }

    function renderListings() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const sort = document.getElementById("sortSelect").value;

      let result = listings.filter(item => {
        const matchesCategory = activeCategory === "Todas" || item.category === activeCategory;
        const matchesQuery = `${item.title} ${item.location} ${item.category} ${item.description || ""}`.toLowerCase().includes(query);
        const matchesFavorite = !showFavorites || favorites.includes(item.id);
        return matchesCategory && matchesQuery && matchesFavorite;
      });

      if (sort === "low") result.sort((a, b) => a.price - b.price);
      else if (sort === "high") result.sort((a, b) => b.price - a.price);
      else result.sort((a, b) => b.date - a.date);

      document.getElementById("listingHeading").textContent =
        showFavorites ? "Os meus favoritos" :
        activeCategory === "Todas" ? "Anúncios recentes" : activeCategory;

      listingGrid.innerHTML = result.length ? result.map(item => `
        <article class="card">
          <div class="photo">
            ${item.image
              ? `<img src="${escapeHTML(item.image)}" alt="${escapeHTML(item.title)}" onerror="this.remove()">`
              : `<span aria-hidden="true">${escapeHTML(item.emoji || "📦")}</span>`}
          </div>
          <button class="heart ${favorites.includes(item.id) ? "saved" : ""}"
                  data-favorite="${item.id}" aria-label="Adicionar aos favoritos">
            ${favorites.includes(item.id) ? "♥" : "♡"}
          </button>
          <div class="card-body">
            <div class="price">${euro(item.price)}</div>
            <h3>${escapeHTML(item.title)}</h3>
            <div class="meta">${escapeHTML(item.location)} · ${escapeHTML(item.category)}</div>
          </div>
        </article>
      `).join("") : `<div class="empty">Não encontrámos anúncios. Experimente outra pesquisa ou categoria.</div>`;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    renderCategories();
    renderListings();

    categories.addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      activeCategory = button.dataset.category;
      showFavorites = false;
      document.getElementById("favoritesBtn").classList.remove("btn-primary");
      renderCategories();
      renderListings();
    });

    listingGrid.addEventListener("click", event => {
      const button = event.target.closest("[data-favorite]");
      if (!button) return;
      const id = Number(button.dataset.favorite);
      favorites = favorites.includes(id)
        ? favorites.filter(favorite => favorite !== id)
        : [...favorites, id];
      save();
      renderListings();
    });

    document.getElementById("searchBtn").addEventListener("click", renderListings);
    document.getElementById("searchInput").addEventListener("input", renderListings);
    document.getElementById("sortSelect").addEventListener("change", renderListings);

    document.getElementById("favoritesBtn").addEventListener("click", event => {
      showFavorites = !showFavorites;
      activeCategory = "Todas";
      event.currentTarget.classList.toggle("btn-primary", showFavorites);
      renderCategories();
      renderListings();
    });

    const dialog = document.getElementById("listingDialog");
    document.getElementById("openForm").addEventListener("click", () => dialog.showModal());
    document.getElementById("closeForm").addEventListener("click", () => dialog.close());

    document.getElementById("listingForm").addEventListener("submit", event => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const item = {
        id: Date.now(),
        title: data.get("title").trim(),
        price: Number(data.get("price")),
        category: data.get("category"),
        location: data.get("location").trim(),
        emoji: data.get("emoji"),
        description: data.get("description").trim(),
        image: data.get("image").trim(),
        date: Date.now()
      };

      if (item.image && !/^https?:\/\//i.test(item.image)) {
        alert("A imagem deve começar com https:// ou http://");
        return;
      }

      listings.unshift(item);
      save();
      event.currentTarget.reset();
      dialog.close();
      activeCategory = "Todas";
      showFavorites = false;
      renderCategories();
      renderListings();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
